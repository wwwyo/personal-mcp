version: 2
updates:
  - package-ecosystem: bun
    directory: "/worker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun-worker:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: "/camera"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun-camera:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]
