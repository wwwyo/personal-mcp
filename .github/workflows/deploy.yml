name: Deploy

# main に worker/ の変更が入ったら Worker をデプロイする。手元から流し直すときは Actions の Run workflow。
# 要るもの: repository secret CLOUDFLARE_API_TOKEN（docs/setup.md の「3. デプロイする」）。
# secret（MCP_BEARER_TOKEN など Worker の secret）は今まで通り手元の secrets:sync で入れる。ここでは扱わない。

on:
  push:
    branches:
      - main
    paths:
      - worker/**
      - mise.toml
      - .github/workflows/deploy.yml
  workflow_dispatch:

# デプロイは途中で止めない。後から来た push は前のデプロイが終わるのを待つ
concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # fresh な CI では workers.dev の subdomain を Void が知らないので渡す（docs/setup.md の本番 URL と同じ）
      CLOUDFLARE_WORKERS_SUBDOMAIN: mix-mix
    steps:
      - name: CLOUDFLARE_API_TOKEN が無ければ止める
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::repository secret CLOUDFLARE_API_TOKEN が未設定（docs/setup.md の「3. デプロイする」を見る）"
            exit 1
          fi
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bunx void deploy --platform cloudflare
      # deploy が途中で落ちても、それまでに void.lock.json が変わっていれば知らせる
      - name: void.lock.json が変わっていないか確かめる
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          if ! git diff --quiet -- void.lock.json; then
            git diff -- void.lock.json
            echo "::warning::デプロイで void.lock.json が変わった。手元で main を pull してから bunx void deploy を流し、変わった void.lock.json を commit する（Durable Object の migration 履歴。docs/setup.md の「3. デプロイする」）"
          fi
